- insert:
    - id: artex-orchestration
      name: '@local/dsh-artex'
      config:
        provider: spawn
        maxWorkers: 3
        maxRounds: 24
        maxStalls: 2
        debounceMs: 800
        heartbeatMs: 600000
        workerTimeoutMs: 1200000
        plannerTimeoutMs: 900000
        settleGraceMs: 90000
        budgetMs: 0
        isolateWorkdir: false
        # hybrid 总开关：默认开启；false=强制传统 planner-only（可在单任务用 analyst:false 覆盖）
        enableHybrid: true
        # 全局视野策略：hybrid（默认，按触发跑 analyst）/ planner（只用 brief）/ analyst（每轮都跑）
        viewMode: hybrid
        analystMaxRuns: 4
        analystEveryRounds: 3
        analystFactThreshold: 8
        analystCooldownMs: 30000
        analystTimeoutMs: 180000
